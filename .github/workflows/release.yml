name: Release CI

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v1.1.0.1 or v1.1.0.1-debug.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft release from changelogs
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${INPUT_TAG_NAME}"
          fi

          # 版本方案：正式版 v<上游三段>.<发布序号>，如 v1.1.0.1；
          # 验证打包用调试版 v<正式版本>-debug.<序号>，如 v1.1.0.1-debug.1。
          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-debug\.[0-9]+)?$ ]]; then
            echo "::error::Release tag must look like v1.1.0.1 or v1.1.0.1-debug.1, got '${tag_name}'."
            exit 1
          fi

          git fetch --force --tags
          if ! git rev-parse --verify --quiet "refs/tags/${tag_name}" >/dev/null; then
            echo "::error::Tag '${tag_name}' does not exist."
            exit 1
          fi

          git checkout --detach "refs/tags/${tag_name}"

          version="${tag_name#v}"
          debug=false
          if [[ "${version}" == *-debug.* ]]; then
            debug=true
          fi

          if [[ "${debug}" == "true" ]]; then
            # 调试 tag 只用于验证打包，不要求对应的 CHANGELOG 段落。
            {
              printf 'Debug build for packaging verification.\n\n'
              printf '<hr>\n\n'
              printf '用于验证打包流程的调试构建。\n'
            } > release-body.md
          else
            if [[ ! -f CHANGELOG.md ]]; then
              echo "::error::CHANGELOG.md is required. Add a '## [${version}]' section before pushing the release tag."
              exit 1
            fi
            if [[ ! -f CHANGELOG.zh-CN.md ]]; then
              echo "::error::CHANGELOG.zh-CN.md is required. Add a '## [${version}]' section before pushing the release tag."
              exit 1
            fi

            extract_changelog_section() {
              local file="$1"
              local output="$2"

              awk -v version="${version}" '
              function is_target_heading(line) {
                return line ~ "^##[[:space:]]+\\[?" version "\\]?"
              }

              /^##[[:space:]]+/ {
                if (capture) {
                  exit
                }

                if (is_target_heading($0)) {
                  capture = 1
                  next
                }
              }

              capture {
                print
              }
              ' "${file}" | sed '/./,$!d' > "${output}"
            }

            extract_changelog_section CHANGELOG.md release-body-en.md
            extract_changelog_section CHANGELOG.zh-CN.md release-body-zh.md

            if [[ ! -s release-body-en.md ]]; then
              echo "::error::CHANGELOG.md does not contain a release section for ${version}."
              exit 1
            fi
            if [[ ! -s release-body-zh.md ]]; then
              echo "::error::CHANGELOG.zh-CN.md does not contain a release section for ${version}."
              exit 1
            fi

            {
              cat release-body-en.md
              printf '\n\n<hr>\n\n'
              cat release-body-zh.md
            } > release-body.md
          fi

          prerelease=false
          if [[ "${debug}" == "true" || "${version}" == *-* ]]; then
            prerelease=true
          fi

          title="${tag_name}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            if [[ "${prerelease}" == "true" ]]; then
              gh release edit "${tag_name}" --draft --prerelease --title "${title}" --notes-file release-body.md
            else
              gh release edit "${tag_name}" --draft --title "${title}" --notes-file release-body.md
            fi
          else
            if [[ "${prerelease}" == "true" ]]; then
              gh release create "${tag_name}" --draft --prerelease --title "${title}" --notes-file release-body.md --verify-tag
            else
              gh release create "${tag_name}" --draft --title "${title}" --notes-file release-body.md --verify-tag
            fi
          fi

          release_id="$(gh release view "${tag_name}" --json databaseId --jq .databaseId)"

          {
            echo "prerelease=${prerelease}"
            echo "release_id=${release_id}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

  build-app:
    name: Build ${{ matrix.label }}
    needs: release-metadata
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: ${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract changelog body
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ needs.release-metadata.outputs.tag_name }}"
          version="${tag_name#v}"

          if [[ "${version}" == *-debug.* ]]; then
            # 调试 tag 只用于验证打包，不要求对应的 CHANGELOG 段落。
            {
              printf 'Debug build for packaging verification.\n\n'
              printf '<hr>\n\n'
              printf '用于验证打包流程的调试构建。\n'
            } > release-body.md
          else
            extract_changelog_section() {
              local file="$1"
              local output="$2"

              awk -v version="${version}" '
              function is_target_heading(line) {
                return line ~ "^##[[:space:]]+\\[?" version "\\]?"
              }

              /^##[[:space:]]+/ {
                if (capture) {
                  exit
                }

                if (is_target_heading($0)) {
                  capture = 1
                  next
                }
              }

              capture {
                print
              }
              ' "${file}" | sed '/./,$!d' > "${output}"
            }

            extract_changelog_section CHANGELOG.md release-body-en.md
            extract_changelog_section CHANGELOG.zh-CN.md release-body-zh.md

            if [[ ! -s release-body-en.md ]]; then
              echo "::error::CHANGELOG.md does not contain a release section for ${version}."
              exit 1
            fi
            if [[ ! -s release-body-zh.md ]]; then
              echo "::error::CHANGELOG.zh-CN.md does not contain a release section for ${version}."
              exit 1
            fi

            {
              cat release-body-en.md
              printf '\n\n<hr>\n\n'
              cat release-body-zh.md
            } > release-body.md
          fi

          delimiter="CHANGELOG_BODY_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delimiter}"
            cat release-body.md
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      # Windows 只产出裸 exe（不构建安装包），macOS 产出 dmg 与 updater 用的 app.tar.gz。
      # 关闭 CI 环境变量，避免 Tauri 打包器按 CI 模式改变产物行为。
      - name: Build app
        shell: bash
        env:
          CI: false
          PLATFORM: ${{ matrix.os }}
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pnpm tauri build --target ${{ matrix.target }} --no-bundle
          else
            pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
          fi

      # 统一产物命名：EcoPasteSync_<tag>_<平台>_<架构>.<类型>
      # 例如 EcoPasteSync_v1.1.0.1-debug.12_windows_x64.zip。
      - name: Package and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag_name="${{ needs.release-metadata.outputs.tag_name }}"
          release_dir="src-tauri/target/${{ matrix.target }}/release"

          arch="x64"
          if [[ "${{ matrix.target }}" == aarch64* ]]; then
            arch="aarch64"
          fi

          platform="windows"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            platform="macos"
          fi

          base_name="EcoPasteSync_${tag_name}_${platform}_${arch}"
          assets=()

          if [[ "${platform}" == "windows" ]]; then
            exe="${release_dir}/EcoPasteSync.exe"
            if [[ ! -f "${exe}" ]]; then
              # 兜底：部分 Tauri 版本仍保留 Cargo 包名作为二进制名。
              exe="${release_dir}/EcoPaste.exe"
            fi
            if [[ ! -f "${exe}" ]]; then
              echo "::error::Portable exe not found under ${release_dir}."
              exit 1
            fi

            dist="dist-portable"
            rm -rf "${dist}"
            mkdir -p "${dist}"
            cp "${exe}" "${dist}/EcoPasteSync.exe"

            zip_name="${base_name}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path 'dist-portable/*' -DestinationPath '${zip_name}' -Force"
            assets+=("${zip_name}")
          else
            # 应用已移除自动更新能力，macOS 只需分发 dmg 安装镜像。
            dmg_files=("${release_dir}"/bundle/dmg/*.dmg)
            if [[ ${#dmg_files[@]} -eq 0 ]]; then
              echo "::error::macOS dmg not found under ${release_dir}/bundle/dmg."
              exit 1
            fi

            dmg_name="${base_name}.dmg"
            cp "${dmg_files[0]}" "${dmg_name}"
            assets+=("${dmg_name}")
          fi

          echo "Uploading ${assets[*]} to release ${tag_name}"
          gh release upload "${tag_name}" "${assets[@]}" --clobber
